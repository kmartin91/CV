<script>
(function () {
  // Light is the house theme; dark only when the visitor picked it.
  var t = 'light';
  try {
    if (localStorage.getItem('theme') === 'dark') t = 'dark';
  } catch (e) {
    t = 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
